<meta charset="utf-8">
<!--
  새로운개혁교회 홈페이지 첫 화면 — 통역 자막 바로가기 띠
  ─────────────────────────────────────────────────────────────
  · 유튜브 채널·예배 장소가 있는 띠 바로 아래에 넣습니다.
    워드프레스 첫 페이지 편집 → [사용자 정의 HTML] 블록 → 이 파일 전체 붙여넣기
  · 색과 글꼴은 홈페이지에서 직접 재서 맞췄습니다.
      띠 배경 #EBE3DB · 제목 Rubik 600 #1A1A1A · 본문 Noto Sans KR #494A4B · 주황 #FF7011
  · CSS가 전부 #lw-cta 안에만 걸려 있어 홈페이지 다른 곳을 건드리지 않습니다.
  · 링크는 교회 홈페이지 안내 페이지(saeroun.org/translate)로 갑니다.
    자막 화면(ngrok)으로 바로 보내면 예배 시간이 아닐 때 안 열려 고장 난 링크로 보입니다.
-->
<div id="lw-cta">
<style>
#lw-cta{--tan:#EBE3DB;--ink:#1A1A1A;--ink2:#494A4B;--orange:#FF7011;
  display:block;box-sizing:border-box;width:100%;
  background:var(--tan);border-radius:10px;padding:26px 30px;
  font-family:"Noto Sans KR",sans-serif;-webkit-font-smoothing:antialiased}
#lw-cta *,#lw-cta *::before,#lw-cta *::after{box-sizing:border-box;margin:0;padding:0}

#lw-cta a.row{display:flex;align-items:center;gap:22px;text-decoration:none;color:inherit}
#lw-cta a.row:hover .btn{background:#e85f06}
#lw-cta a.row:hover .tile{transform:translateY(-2px)}

#lw-cta .tile{flex:0 0 62px;width:62px;height:62px;background:#fff;border-radius:10px;
  display:flex;align-items:center;justify-content:center;transition:transform .15s ease;
  box-shadow:0 1px 3px rgba(0,0,0,.06)}
#lw-cta .tile svg{width:30px;height:30px;display:block}

#lw-cta .txt{flex:1;min-width:0}
#lw-cta .t1,#lw-cta .t2,#lw-cta .t3{display:block}   /* span이라 블록으로 바꿔 줘야 줄이 나뉜다 */
#lw-cta .t1{font-family:Rubik,"Noto Sans KR",sans-serif;font-size:23px;font-weight:600;
  color:var(--ink);line-height:1.3;letter-spacing:-.01em}
#lw-cta .t2{font-size:17px;font-weight:600;color:var(--ink);margin-top:2px;line-height:1.35}
#lw-cta .t3{font-size:15px;color:var(--ink2);margin-top:6px;line-height:1.5}

#lw-cta .btn{flex:0 0 auto;background:var(--orange);color:#fff;border-radius:8px;
  padding:13px 24px;font-size:16px;font-weight:600;white-space:nowrap;
  transition:background .15s ease;font-family:"Noto Sans KR",sans-serif}
#lw-cta .btn .en{display:block;font-size:12.5px;font-weight:500;opacity:.92;margin-top:1px}

@media (max-width:781px){
  #lw-cta{padding:22px 20px;border-radius:8px}
  #lw-cta a.row{flex-wrap:wrap;gap:16px}
  #lw-cta .tile{flex:0 0 52px;width:52px;height:52px}
  #lw-cta .tile svg{width:26px;height:26px}
  /* flex-basis를 0으로 둬야 글이 아이콘 옆에 붙는다. auto면 글 길이만큼 자리를 요구해 줄이 넘어간다 */
  #lw-cta .txt{flex:1 1 0;min-width:0}
  #lw-cta .t1{font-size:20px}
  #lw-cta .t2{font-size:15.5px}
  #lw-cta .t3{font-size:14px}
  #lw-cta .btn{flex:1 1 100%;text-align:center;padding:14px 20px}
}
</style>

  <a class="row" href="https://saeroun.org/translate">
    <span class="tile" aria-hidden="true">
      <!-- 자막(캡션) 표시 -->
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="1.6" y="4" width="20.8" height="14.4" rx="3.2"
              stroke="#FF7011" stroke-width="1.9"/>
        <path d="M6.2 13.4h4.3M13.2 13.4h4.6M6.2 9.6h2.6M11.4 9.6h6.4"
              stroke="#FF7011" stroke-width="1.9" stroke-linecap="round"/>
      </svg>
    </span>

    <span class="txt">
      <span class="t1">English Subtitles</span>
      <span class="t2">실시간 통역 자막</span>
      <span class="t3">설교를 원하는 언어로 휴대폰에서 보세요 · Follow the sermon on your phone</span>
    </span>

    <span class="btn">바로가기<span class="en">Open the guide</span></span>
  </a>
</div>
