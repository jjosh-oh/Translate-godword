<meta charset="utf-8">
<!--
  새로운개혁교회 홈페이지 첫 화면 — 통역 자막 바로가기 띠
  ─────────────────────────────────────────────────────────────
  · 워드프레스 [사용자 정의 HTML] 블록에 이 파일 전체를 붙여넣습니다.
  · 넓은 곳에 넣으면 한 줄로, 좁은 칸에 넣으면 알아서 접힙니다.
    화면 폭이 아니라 **들어간 칸의 폭**을 보고 배치를 바꿉니다(container query).
    화면 폭으로 판단하면 "화면은 넓은데 칸은 좁은" 경우에 글자가 짓눌린다 — 실제로 겪었다.
  · 색과 글꼴은 홈페이지에서 직접 재서 맞췄습니다.
      띠 배경 #EBE3DB · 제목 Rubik 600 #1A1A1A · 본문 Noto Sans KR #494A4B · 주황 #FF7011
  · CSS가 전부 #lw-cta 안에만 걸려 있어 홈페이지 다른 곳을 건드리지 않습니다.
  · 링크는 교회 홈페이지 안내 페이지(saeroun.org/translate)로 갑니다.
    자막 화면(ngrok)으로 바로 보내면 예배 시간이 아닐 때 안 열려 고장 난 링크로 보입니다.
-->
<div id="lw-cta">
<style>
#lw-cta{--tan:#EBE3DB;--ink:#1A1A1A;--ink2:#494A4B;--orange:#FF7011;
  display:block;box-sizing:border-box;width:100%;container-type:inline-size;
  background:var(--tan);border-radius:10px;padding:24px 28px;
  /* 위 3칸 띠와 배경색이 같아 붙으면 한 덩어리로 보인다.
     칸 사이 간격(가로·세로 모두 32px)과 같게 띄운다 */
  margin-top:32px;
  font-family:"Noto Sans KR",sans-serif;-webkit-font-smoothing:antialiased}
#lw-cta *,#lw-cta *::before,#lw-cta *::after{box-sizing:border-box;margin:0;padding:0}

/* 줄바꿈이 되는 구조라 container query를 못 쓰는 브라우저에서도 짓눌리지 않는다 */
#lw-cta a.row{display:flex;flex-wrap:wrap;align-items:center;gap:18px;
  text-decoration:none;color:inherit}
#lw-cta a.row:hover .btn{background:#e85f06}
#lw-cta a.row:hover .tile{transform:translateY(-2px)}

/* 위 세 칸(유튜브·주일예배·주중모임)과 같은 모양: 타일 56x56 · 모서리 5px · 그림자 없음
   · 아이콘 22px · 간격 20px · 제목 윗선에 맞춰 위로 정렬 (실제 값을 재서 맞췄다) */
#lw-cta .main{flex:1 1 300px;min-width:0;display:flex;align-items:flex-start;gap:20px}

/* 넓은 화면 — 아이콘·글·단추를 한 덩어리로 가운데에 둔다.
   단추를 오른쪽 끝에 두면 글과 떨어져 보이고, 글 옆에 붙이면 오른쪽 절반이 빈다 */
@container (min-width:561px){
  #lw-cta a.row{justify-content:center;flex-wrap:nowrap;gap:28px}
  #lw-cta .main{flex:0 1 auto}
}

#lw-cta .tile{flex:0 0 56px;width:56px;height:56px;background:#fff;border-radius:5px;
  display:flex;align-items:center;justify-content:center;transition:transform .15s ease}
#lw-cta .tile svg{width:22px;height:22px;display:block}

#lw-cta .txt{flex:1 1 auto;min-width:0}
#lw-cta .t1,#lw-cta .t2,#lw-cta .t3{display:block}
#lw-cta .t1{font-family:Rubik,"Noto Sans KR",sans-serif;font-size:22px;font-weight:600;
  color:var(--ink);line-height:1.3;letter-spacing:-.01em}
#lw-cta .t2{font-size:16.5px;font-weight:600;color:var(--ink);margin-top:2px;line-height:1.35}
#lw-cta .t3{font-size:14.5px;color:var(--ink2);margin-top:5px;line-height:1.5}

#lw-cta .btn{flex:0 0 auto;background:var(--orange);color:#fff;border-radius:8px;
  padding:13px 24px;font-size:16px;font-weight:600;white-space:nowrap;text-align:center;
  transition:background .15s ease;font-family:"Noto Sans KR",sans-serif}
#lw-cta .btn .en{display:block;font-size:12.5px;font-weight:500;opacity:.92;margin-top:1px}

/* 좁을 때 "실시간 통역 자막" 옆에 붙는 작은 단추 — 넓을 때는 숨긴다 */
#lw-cta .pill{display:none;background:var(--orange);color:#fff;border-radius:999px;
  font-size:12.5px;font-weight:600;line-height:1;padding:5px 11px 6px;margin-left:8px;
  vertical-align:2px;white-space:nowrap;transition:background .15s ease}
#lw-cta a.row:hover .pill{background:#e85f06}

/* 칸이 좁아지면(휴대폰) — 큰 단추를 없애고 "실시간 통역 자막" 옆에 작은 단추를 붙인다.
   단추 줄이 사라져 띠 높이가 크게 줄어든다 */
@container (max-width:560px){
  #lw-cta{padding:18px 20px}
  #lw-cta .btn{display:none}
  #lw-cta .pill{display:inline-block}
  /* 설명 글의 영어 부분은 다음 줄로 */
  #lw-cta .t3 .sep{display:none}
  #lw-cta .t3 .t3en{display:block}
}
/* 더 좁으면 — 글자를 줄이고 아이콘을 작게 */
@container (max-width:380px){
  #lw-cta{padding:16px 16px}
  #lw-cta a.row{gap:14px}
  #lw-cta .t1{font-size:19px}
  #lw-cta .t2{font-size:15px}
  #lw-cta .t3{font-size:13.5px}
}
</style>

  <a class="row" href="https://saeroun.org/translate">
    <span class="main">
      <span class="tile" aria-hidden="true">
        <!-- 자막(캡션) 표시 -->
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="1.6" y="4" width="20.8" height="14.4" rx="3.2"
                stroke="#FF7011" stroke-width="1.9"/>
          <path d="M6.2 13.4h4.3M13.2 13.4h4.6M6.2 9.6h2.6M11.4 9.6h6.4"
                stroke="#FF7011" stroke-width="1.9" stroke-linecap="round"/>
        </svg>
      </span>
      <span class="txt">
        <span class="t1">English Subtitles</span>
        <span class="t2">실시간 통역 자막<span class="pill">Open ›</span></span>
        <span class="t3">설교를 원하는 언어로 휴대폰에서 보세요<span class="sep"> · </span><span class="t3en">Follow the sermon on your phone</span></span>
      </span>
    </span>

    <span class="btn">Open the guide ›</span>
  </a>
</div>
